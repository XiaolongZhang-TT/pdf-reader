[package]
name = "paper"
version = "0.1.0"
description = "Paper — a quiet, focused, native-feeling PDF reader"
authors = ["Xiaolong Zhang <11617214+XiaolongZhang-TT@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/XiaolongZhang-TT/pdf-reader"
homepage = "https://github.com/XiaolongZhang-TT/pdf-reader"
edition = "2021"
rust-version = "1.77"

[lib]
name = "paper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
