name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build bundles and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Paper ${{ github.ref_name }}"
          releaseBody: |
            Cross-platform builds of Paper ${{ github.ref_name }}.

            See [CHANGELOG.md](https://github.com/XiaolongZhang-TT/pdf-reader/blob/main/CHANGELOG.md) for details.

            **macOS:** builds are unsigned. If macOS blocks the app, right-click → Open,
            or run `xattr -dr com.apple.quarantine /Applications/Paper.app`.
            **Windows:** if SmartScreen appears, choose "More info" → "Run anyway".
            **Linux:** make the AppImage executable with `chmod +x` before running.
          releaseDraft: false
          prerelease: false

      - name: Generate checksums
        run: node scripts/checksums.mjs

      - name: Attach checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "checksums-${{ runner.os }}.txt" --clobber
